name: Deploy Termine-App zu GitHub Pages

on:
  push:
    branches:
      - claude/article-sale-crawler-xf1kg5
    paths:
      - "app/**"
      - ".github/workflows/deploy-app.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: App-Ordner als Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - name: Auf GitHub Pages deployen
        id: deployment
        uses: actions/deploy-pages@v4
